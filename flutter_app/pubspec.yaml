name: mobilecomfy
description: A lightweight Android client for the LazyComfy custom node.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  http: ^1.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^4.0.4
  web_socket_channel: ^3.0.3
  google_fonts: ^9.0.0
  http_parser: ^4.1.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
