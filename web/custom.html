<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem("lazycomfy.theme")==="dark"){document.documentElement.dataset.theme="dark";}}catch(e){}</script>
<title>LazyComfy Custom</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --bg-soft:#f3f4f6; --bg-card:#ffffff;
  --border:#ccc; --border-soft:#e5e5e5;
  --ink:#171717; --ink-2:#252525; --ink-3:#313131;
  --muted:#4b5563; --muted-2:#6b7280; --muted-3:#9ca3af; --muted-4:#c1c6cf;
  --accent:#784cd9; --accent-deep:#663ac7; --accent-soft:#dccefb; --accent-hover:#663ac7; --accent-tint:#f5f2fa; --accent-2:#a380f3;
  --ok:#16a34a; --warn:#b45309; --err:#b91c1c;
  --ring:rgba(120,76,217,.16);
  --shadow:0 4px 16px rgba(23,23,23,.08);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg-soft:#0f0f0f; --bg-card:#171717;
  --border:#4a4a4a; --border-soft:#313131;
  --ink:#e1e1e1; --ink-2:#c6c6cc; --ink-3:#a2a2aa;
  --muted:#b0b0b7; --muted-2:#8e8e96; --muted-3:#6e6e76; --muted-4:#53535a;
  --accent:#a380f3; --accent-deep:#c0a6fa; --accent-soft:#251b3f; --accent-hover:#b490ff; --accent-tint:#1d1633; --accent-2:#a380f3;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --ring:rgba(163,128,243,.25);
  --shadow:0 4px 16px rgba(0,0,0,.6);
}
html[data-theme="dark"] .btn-primary:not(:disabled){ color:#171717; }
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
*{
  scrollbar-width:none !important;
  -ms-overflow-style:none !important;
  scrollbar-gutter:auto !important;
}
*::-webkit-scrollbar{
  display:none !important;
  width:0 !important;
  height:0 !important;
}
*::-webkit-scrollbar-track,
*::-webkit-scrollbar-thumb,
*::-webkit-scrollbar-corner{
  display:none !important;
}
html{
  scrollbar-width:none !important;
  -ms-overflow-style:none !important;
}
html::-webkit-scrollbar{
  display:none !important;
}
html,body{ margin:0; padding:0; }
body{ background:radial-gradient(1100px 460px at 50% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%), var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; font-weight:300; line-height:1.55; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; min-height:100dvh; }
button{ font:inherit; color:inherit; cursor:pointer; }
input,select,textarea{ font:inherit; color:var(--ink); background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:7px 9px; width:100%; outline:none; font-size:12px; transition:border-color .15s, box-shadow .15s, background-color .15s; }
input:focus,select:focus,textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
input[type=checkbox]{ width:auto; accent-color:var(--accent); }
input[type=number]{ font-family:var(--mono); font-size:11.5px; }
textarea{ resize:vertical; min-height:66px; line-height:1.5; }
label{ display:block; font-family:var(--mono); font-size:10px; font-weight:500; color:var(--muted-2); margin-bottom:5px; letter-spacing:1.2px; text-transform:uppercase; }
a{ color:var(--accent); text-decoration:none; }
button:focus-visible{ outline:2px solid var(--accent-2); outline-offset:1px; }
.topbar{ position:sticky; top:0; z-index:50; flex:none; display:flex; align-items:center; gap:12px; padding:10px 18px; background:color-mix(in srgb, var(--bg-card) 86%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.brand{ display:flex; align-items:center; gap:9px; font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.2px; color:var(--ink); min-width:0; }
.brand svg{ flex:none; }
.chip{ font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--accent-deep); background:var(--accent-soft); border:1px solid var(--accent-soft); border-radius:999px; padding:2px 8px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.conn{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted-2); }
.dot{ width:8px; height:8px; border-radius:50%; background:#aaa; }
.dot.on{ background:var(--ok); } .dot.retry{ background:var(--warn); }
.icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; padding:0; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--muted-2); transition:all .15s; flex:none; }
.icon-btn:hover{ color:var(--ink); border-color:var(--accent); }
.layout{ display:grid; grid-template-columns:400px 1fr; gap:14px; padding:14px 16px; max-width:1440px; width:100%; margin:0 auto; align-items:start; align-content:start; flex:1 0 auto; }
.panel{ background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:0; }
.group{ margin-bottom:16px; }
.group > label{ margin-bottom:9px; padding-bottom:6px; border-bottom:1px solid var(--border-soft); }
.btn-primary{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:13px; letter-spacing:.3px; }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary:not(:disabled):hover{ background:var(--accent-hover); }
.btn-secondary{ width:100%; padding:9px; border:1px solid var(--border); border-radius:10px; background:var(--bg-card); color:var(--ink-2); font-size:12px; }
.spin{ display:none; } .busy .spin{ display:inline-flex; }
.err-banner{ margin-top:10px; padding:8px 10px; border:1px solid var(--err); border-radius:8px; color:var(--err); font-size:11.5px; display:flex; gap:8px; align-items:flex-start; }
.err-banner button{ margin-left:auto; background:none; border:none; color:inherit; font-size:14px; line-height:1; }
/* node cards */
.node-card{ border:1px solid var(--border-soft); border-radius:10px; margin-bottom:10px; background:var(--bg-card); }
.node-head{ display:flex; align-items:center; gap:8px; padding:9px 10px; cursor:pointer; user-select:none; }
.node-head .chev{ flex:none; color:var(--muted-3); transition:transform .15s; font-size:10px; width:14px; text-align:center; }
.node-card.closed .node-head .chev{ transform:rotate(-90deg); }
.node-title{ flex:1; min-width:0; font-family:var(--mono); font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.node-title .nid{ color:var(--muted-4); font-size:10px; }
.node-type{ flex:none; font-family:var(--mono); font-size:9px; color:var(--muted-3); background:var(--bg-soft); border:1px solid var(--border-soft); border-radius:5px; padding:1px 6px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.node-errdot{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--err); }
.node-bypass{ flex:none; font-family:var(--mono); font-size:9px; letter-spacing:.5px; border:1px solid var(--border); background:var(--bg-card); color:var(--muted-2); border-radius:6px; padding:3px 8px; }
.node-bypass.on{ border-color:var(--warn); color:var(--warn); }
.node-body{ padding:2px 10px 10px; border-top:1px solid var(--border-soft); }
.node-card.closed .node-body{ display:none; }
.node-card.bypassed{ opacity:.55; }
.wrow{ margin-top:8px; }
.wrow label{ display:flex; justify-content:space-between; align-items:center; }
.wrow .wval{ font-family:var(--mono); font-size:10px; color:var(--muted-3); text-transform:none; letter-spacing:0; }
.wlink{ font-size:10.5px; color:var(--muted-3); font-family:var(--mono); margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wlink b{ color:var(--accent-deep); font-weight:500; }
.nout{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.nout img, .nout video{ width:96px; height:96px; object-fit:cover; border-radius:8px; border:1px solid var(--border-soft); background:var(--bg-soft); cursor:pointer; }
.nout video{ object-fit:contain; }
/* empty state */
.empty{ border:1px dashed var(--border); border-radius:12px; padding:44px 20px; text-align:center; color:var(--muted-3); }
#emptyState .empty{ margin:0 auto; max-width:440px; }
.empty .eicon{ font-size:30px; }
.empty h3{ margin:10px 0 4px; font-size:14px; font-weight:500; color:var(--ink-2); }
.empty p{ margin:0 0 14px; font-size:12px; }
/* search */
.searchrow{ display:flex; gap:8px; margin-bottom:10px; }
/* bottom run bar */
.runbar{ position:fixed; bottom:0; left:0; right:0; z-index:60; display:flex; gap:8px; align-items:center; padding:10px 16px; background:color-mix(in srgb, var(--bg-card) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--border); }
body.has-run{ padding-bottom:84px; }
body.has-run .toasts{ bottom:84px; }
.runbar .btn-primary{ width:auto; flex:1; }
.runbar .btn-secondary{ width:auto; flex:none; padding:11px 16px; }
.runstat{ font-family:var(--mono); font-size:10px; color:var(--muted-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-wrap{ height:4px; background:var(--bg-soft); border-radius:999px; overflow:hidden; margin-top:8px; }
.progress-bar{ height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); border-radius:999px; transition:width .3s; }
/* gallery */
.gal{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.gitem{ position:relative; border:1px solid var(--border-soft); border-radius:10px; overflow:hidden; background:var(--bg-soft); aspect-ratio:1/1; }
.gitem img, .gitem video{ width:100%; height:100%; object-fit:cover; display:block; }
.gitem .gmeta{ position:absolute; left:0; right:0; bottom:0; padding:8px 8px 6px; font-family:var(--mono); font-size:9px; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.72)); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gitem .gopen{ position:absolute; top:6px; right:6px; }
/* sidepanel drawer */
.side-backdrop{ position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.5); }
.side-panel{ position:fixed; top:0; left:0; bottom:0; z-index:71; width:min(360px,92vw); background:var(--bg-card); border-right:1px solid var(--border); display:flex; flex-direction:column; box-shadow:8px 0 32px rgba(0,0,0,.18); }
.side-head{ flex:none; display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
.side-head h3{ margin:0; flex:1; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-body{ flex:1; overflow-y:auto; padding:10px 12px 16px; }
.side-sec{ font-family:var(--mono); font-size:10px; letter-spacing:1.2px; color:var(--muted-3); margin:12px 2px 6px; text-transform:uppercase; }
.side-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; margin-bottom:6px; color:var(--ink-2); font-size:12.5px; }
.side-item:hover{ border-color:var(--accent); }
.side-item .sub{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--muted-3); }
.side-item .grow{ flex:1; min-width:0; overflow:hidden; }
.side-item .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-item .mini{ flex:none; }
.crumb{ display:flex; align-items:center; gap:6px; margin-bottom:8px; font-family:var(--mono); font-size:12px; color:var(--muted-2); }
.crumb button{ background:none; border:none; color:var(--accent); font:inherit; padding:0; }
.crumb-back{ display:inline-flex !important; align-items:center; gap:6px; font-size:13.5px !important; font-weight:600; }
.crumb-back svg{ flex:none; }
.kv{ display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:6px 2px; border-bottom:1px solid var(--border-soft); }
.kv span:first-child{ color:var(--muted-2); font-family:var(--mono); font-size:10.5px; }
.kv b{ font-weight:500; color:var(--ink-2); font-family:var(--mono); font-size:10.5px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mbar{ height:8px; border-radius:999px; background:var(--bg-soft); overflow:hidden; margin:4px 2px 10px; }
.mbar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); border-radius:999px; transition:width .5s ease; }
.danger-btn{ width:100%; padding:10px; border:1px solid var(--err); border-radius:10px; background:transparent; color:var(--err); font-size:12.5px; font-weight:600; margin-top:12px; }
.danger-btn.confirm{ background:var(--err); color:#fff; }
.danger-btn:disabled{ opacity:.5; cursor:wait; }
/* options menu */
.opts-pop{ position:fixed; z-index:80; min-width:220px; max-width:min(280px,90vw); background:var(--bg-card); border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.2); padding:6px; }
.opts-pop button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; background:transparent; border:none; border-radius:8px; font-size:12.5px; color:var(--ink-2); }
.opts-pop button:hover:not(:disabled){ background:var(--bg-soft); }
.opts-pop button:disabled{ opacity:.4; cursor:not-allowed; }
.opts-pop button svg{ flex:none; color:var(--muted-2); }
.opts-pop button:hover:not(:disabled) svg{ color:var(--accent); }
/* error toast */
.err-toast{ position:fixed; left:12px; right:12px; bottom:76px; z-index:90; max-width:560px; margin:0 auto; background:var(--bg-card); border:1px solid var(--err); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.25); padding:12px 14px; cursor:pointer; }
.err-toast h4{ margin:0 0 4px; font-size:12.5px; color:var(--err); display:flex; gap:8px; align-items:center; }
.err-toast p{ margin:0; font-size:11.5px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.err-nodes{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.err-node{ font-family:var(--mono); font-size:10px; border:1px solid var(--err); color:var(--err); border-radius:999px; padding:2px 9px; background:transparent; }
.err-actions{ display:flex; gap:8px; margin-top:10px; }
.err-actions button{ flex:1; padding:8px; border-radius:8px; font-size:12px; }
.err-copy{ border:1px solid var(--border); background:var(--bg-card); color:var(--ink-2); }
.err-dismiss{ border:none; background:var(--accent); color:#fff; font-weight:600; }
.flash{ animation:flash 1s ease 2; }
@keyframes flash{ 0%,100%{ box-shadow:none; } 50%{ box-shadow:0 0 0 3px var(--ring); border-color:var(--accent); } }
.toasts{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:120; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{ background:var(--ink); color:var(--bg); font-size:12px; padding:9px 16px; border-radius:999px; box-shadow:var(--shadow); max-width:min(420px,90vw); }
.toast.error{ background:var(--err); color:#fff; }
.toast.ok{ background:var(--ok); color:#fff; }
html[data-theme="dark"] .toast{ background:var(--ink-2); color:var(--ink); }
.meta-line{ font-family:var(--mono); font-size:10px; color:var(--muted-3); margin-top:8px; }
.foot{ flex:none; text-align:center; font-family:var(--mono); color:var(--muted-4); font-size:10px; padding:8px 16px 20px; letter-spacing:.4px; }
/* custom select enhancer (same component as other pages) */
.custom-select{ position:relative; width:100%; min-width:0; }
.custom-select-original{ position:absolute !important; opacity:0 !important; pointer-events:none !important; width:0 !important; height:0 !important; margin:0 !important; }
.custom-select-trigger{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:8px 10px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--ink-2); font:inherit; font-size:12px; line-height:1.4; cursor:pointer; user-select:none; text-align:left; min-height:32px; }
.custom-select-trigger:hover{ border-color:var(--muted-3); color:var(--ink); }
.custom-select.open .custom-select-trigger, .custom-select-trigger:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); color:var(--ink); outline:none; }
.custom-select-value{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:11.5px; }
.custom-select-arrow{ flex:none; width:12px; height:7px; color:var(--muted-3); display:flex; align-items:center; justify-content:center; }
.custom-select.open .custom-select-arrow{ transform:rotate(180deg); color:var(--accent); }
.custom-select-dropdown{ position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:40; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.14); overflow:hidden; }
.custom-select-options{ max-height:200px; overflow-y:auto; padding:4px; display:flex; flex-direction:column; gap:2px; scrollbar-width:none; }
.custom-select-options::-webkit-scrollbar{ display:none; }
.custom-select-option{ display:flex; align-items:center; width:100%; text-align:left; padding:8px 10px; background:transparent; border:none; border-radius:6px; font:inherit; font-size:12px; color:var(--ink-2); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.custom-select-option:hover{ background:var(--bg-soft); color:var(--ink); }
.custom-select-option.active{ background:var(--accent); color:#fff; }
html[data-theme="dark"] .custom-select-option.active{ color:#171717; }
@media (max-width:860px){
  .layout{ grid-template-columns:1fr; padding:10px; }
  .gal{ grid-template-columns:repeat(3,1fr); }
  .chip{ max-width:140px; }
  .topbar{ padding:8px 10px; gap:8px; }
  .conn span:last-child{ display:none; }
}
@media (max-width:480px){ .gal{ grid-template-columns:repeat(2,1fr); } }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" title="Menu">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="#784cd9"/><path d="M13 4.5 7.5 13h4l-1 6.5 6-8.5h-4.5l1-6.5z" fill="#fff"/></svg>
    Custom
    <span class="chip" id="wfChip">no workflow</span>
  </div>
  <div class="topbar-right">
    <span class="conn"><span class="dot" id="connDot"></span><span id="connLabel">Connecting</span></span>
    <button class="icon-btn" id="optsBtn" type="button" aria-label="Workflow options" title="Workflow options" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>
<div class="opts-pop" id="optsPop" hidden></div>

<div class="side-backdrop" id="sideBackdrop" hidden></div>
<aside class="side-panel" id="sidePanel" hidden aria-label="Workflow menu">
  <div class="side-head">
    <h3 id="sideTitle">Menu</h3>
    <button class="icon-btn" id="sideClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="side-body" id="sideBody"></div>
</aside>

<main class="layout">
  <section class="panel" aria-label="Workflow">
    <div class="group" id="emptyState">
      <div class="empty">
        <div class="eicon" style="display:flex;justify-content:center;color:var(--muted-3)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        <h3>No workflow loaded</h3>
        <p>Open the menu to load a workflow</p>
        <button class="btn-secondary" id="emptyOpenBtn" type="button" style="max-width:220px;margin:0 auto">Open menu</button>
      </div>
    </div>
    <div id="wfWrap" hidden>
      <div class="searchrow">

/* ---- helpers ---- */

/* ---- ComfyUI core API (same origin, like /mobile) ---- */
async function core(path, opts) {
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error("Cannot reach ComfyUI (" + e.message + ")"); }
  let data = null;
  const ct = res.headers.get("content-type") || "";
  try { data = ct.indexOf("application/json") >= 0 ? await res.json() : await res.text(); }
  catch (_) {}
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    if (data && typeof data === "object") {
      const em = data.error || data.message;
      msg = (em && typeof em === "object") ? (em.message || JSON.stringify(em).slice(0, 300)) : (em || JSON.stringify(data).slice(0, 300));
    }
    else if (typeof data === "string" && data) msg = data.slice(0, 300);
    const err = new Error(msg);
    err.status = res.status; err.data = data;
    throw err;
  }

}

}
function objectInfoStale() {

/* ---- server stats (RAM/VRAM, live) + restart ---- */
let _srvTimer = null;
let _restartArm = false;
function stopSrvPoll() {
  if (_srvTimer) { clearInterval(_srvTimer); _srvTimer = null; }
  _restartArm = false;
}
function fmtGB(n) {
  if (!Number.isFinite(n) || n <= 0) return "—";
  return (n / 1073741824).toFixed(1) + " GB";
}
function memBar(used, total) {
  if (!total) return "";
  const pct = Math.max(0, Math.min(100, Math.round((used / total) * 100)));
  return '<div class="mbar"><i style="width:' + pct + '%"></i></div>';
}
async function refreshServerStats() {
  const host = $("#srvStats");
  if (!host || $("#sidePanel").hidden) { stopSrvPoll(); return; }
  try {
    const s = await coreGet("/system_stats");
    const sys = (s && s.system) || {};
    const devs = (s && s.devices) || [];
    // CPU-only machines report RAM again as "cpu VRAM" — hide VRAM unless a
    // real accelerator device is present.
    const gpus = devs.filter(d => String(d.type || "").toLowerCase() !== "cpu" && Number(d.vram_total) > 0);
    let h = '<div class="kv"><span>ComfyUI</span><b>' + esc(sys.comfyui_version || "?") + '</b></div>' +
      '<div class="kv"><span>OS</span><b>' + esc(sys.os || "?") + '</b></div>' +
      '<div class="kv"><span>RAM used</span><b>' + esc(fmtGB(sys.ram_total - sys.ram_free) + " / " + fmtGB(sys.ram_total)) + '</b></div>' +
      memBar(sys.ram_total - sys.ram_free, sys.ram_total);
    if (!gpus.length) {
      h += '<p class="meta-line">CPU-only build — no device VRAM to show.</p>';
    }
    gpus.forEach(d => {
      const used = (d.vram_total || 0) - (d.vram_free || 0);
      h += '<div class="kv"><span>' + esc((d.name || d.type || "device") + " VRAM") + '</span><b>' + esc(fmtGB(used) + " / " + fmtGB(d.vram_total)) + '</b></div>' +
        memBar(used, d.vram_total);
    });
    host.innerHTML = h;
  } catch (e) {
    host.innerHTML = '<p class="meta-line">Stats unavailable: ' + esc(errMsg(e)) + '</p>';
  }
}
async function restartComfy() {
  const btn = $("#restartBtn");
  if (!btn || btn.disabled) return;
  if (!_restartArm) {
    _restartArm = true;
    btn.classList.add("confirm");
    btn.textContent = "Tap again to confirm restart";
    setTimeout(() => {
      _restartArm = false;
      const b = $("#restartBtn");
      if (b) { b.classList.remove("confirm"); b.textContent = "Restart ComfyUI"; }
    }, 5000);
    return;
  }
  _restartArm = false;
  btn.disabled = true;
  btn.classList.remove("confirm");
  btn.textContent = "Restarting ComfyUI…";
  try {
    await corePost("/lazycomfy/api/restart", { confirm: true });
    toast("Restarting — the page will reconnect.", "ok");
    const t0 = Date.now();
    while (Date.now() - t0 < 90000) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        await coreGet("/system_stats");
        toast("ComfyUI is back online.", "ok");
        refreshServerStats();
        break;
      } catch (_) {}
    }
  } catch (e) {
    toast("Restart failed: " + errMsg(e), "error");
  } finally {
    const b = $("#restartBtn");
    if (b) { b.disabled = false; b.textContent = "Restart ComfyUI"; }
  }
}
// file browser over core userdata entries (flat list -> folder drill client-side)
const _browser = { entries: [], folder: "", query: "", sort: "name" };
function browserKids() {
  const base = _browser.folder ? _browser.folder + "/" : "";
  const dirs = {}, files = [];
  for (const e of _browser.entries) {
    const rel = e.path.replace(/^workflows\//, "");
    if (rel.slice(0, base.length) !== base) continue;
    const rest = rel.slice(base.length);
    if (!rest) continue;
    if (e.type === "directory" || rest.indexOf("/") >= 0) {
      const d = e.type === "directory" ? rel : base + rest.split("/")[0];
      dirs[d] = Math.max(dirs[d] || 0, e.modified || 0);
    } else if (/\.json$/i.test(e.name)) {
      files.push(e);
    }
  }
  const q = _browser.query.trim().toLowerCase();
  let out = Object.keys(dirs).map(d => ({ dir: true, path: d, name: d.split("/").pop(), modified: dirs[d] }));
  out = out.concat(files.map(f => ({ dir: false, path: f.path.replace(/^workflows\//, ""), name: f.name, modified: f.modified, size: f.size })));
  if (q) out = out.filter(x => x.name.toLowerCase().indexOf(q) >= 0);
  out.sort((a, b) => {
    if (!!a.dir !== !!b.dir) return a.dir ? -1 : 1;
    if (_browser.sort === "date") return (b.modified || 0) - (a.modified || 0);
    return a.name.localeCompare(b.name);
  });
  return out;
}
function renderBrowser(body, title, folder) {
  _browser.folder = folder || "";

/* ---- graph -> API prompt ---- */
function buildPrompt() {
  if (state.wfApi) return { prompt: JSON.parse(JSON.stringify(state.wfApi)), warnings: [] };
  const wf = state.wf, oi = state.objectInfo || {};

  const byId = {};

  (wf.links || []).forEach(l => { links[l[0]] = l; });
  const skipped = {};
  wf.nodes.forEach(n => {
    if (NOTE_TYPES[n.type]) skipped[n.id] = "note";
    else if (n.mode === 4 || state.bypassed[n.id]) skipped[n.id] = "bypassed";
    else if (!oi[n.type]) problems.push({ nodeId: n.id, message: "Unknown node type '" + n.type + "'" });
  });
  function resolveThrough(linkId, depth) {
    if (!linkId || (depth || 0) > 64) return null;
    const l = links[linkId];
    if (!l) return null;
    const src = byId[l[1]];
    if (src && REROUTE_TYPES[src.type]) {
      const rin = (src.inputs || [])[0];
      if (rin && rin.link) return resolveThrough(rin.link, (depth || 0) + 1);
      const rv = (src.widgets_values || [])[0];
      return rv === undefined ? null : { literal: rv };
    }
    return { node: String(l[1]), slot: l[2] };
  }
  const prompt = {};
  for (const n of wf.nodes) {
    if (skipped[n.id]) continue;
    if (!oi[n.type]) continue;
    const inputs = {};
    const slots = widgetSlots(n, oi), vals = n.widgets_values || [];
    const linked = {};
    (n.inputs || []).forEach(inp => { if (inp && inp.link) linked[inp.name] = inp.link; });
    slots.forEach((wname, i) => {
      const v = vals[i];
      if (v !== undefined) inputs[wname] = v;
    });
    for (const iname of Object.keys(linked)) {
      const r = resolveThrough(linked[iname], 0);
      if (!r) { problems.push({ nodeId: n.id, message: "Input '" + iname + "' links to an unreachable node" }); continue; }
      if (r.literal !== undefined) inputs[iname] = r.literal;
      else {
        const sn = byId[Number(r.node)];
        if (sn && skipped[sn.id]) { problems.push({ nodeId: n.id, message: "Input '" + iname + "' depends on bypassed/skipped node #" + sn.id }); continue; }

  }
  if (!Object.keys(prompt).length) {
    problems.push({ nodeId: -1, message: "Nothing to queue (all nodes skipped or unknown)" });
  }
  if (problems.length) {
    const err = new Error("Cannot queue: " + problems.length + " problem(s)");
    err.nodeErrors = problems;
    throw err;
  }
  return { prompt, warnings: [] };
}

/* WS (core) for live progress */
function connectWs() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let ws;
  try { ws = new WebSocket(proto + "://" + location.host + "/ws?clientId=" + encodeURIComponent(getClientId())); }
  catch (_) { scheduleReconnect(); return; }
  state.ws = ws;
  ws.onopen = () => {
    state.wsConnected = true;
    state.wsRetry = 0;
    setConn();
    try { ws.send(JSON.stringify({ type: "feature_flags", data: {} })); } catch (_) {}
    if (state.pingTimer) clearInterval(state.pingTimer);
    state.pingTimer = setInterval(() => { try { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" })); } catch (_) {} }, 25000);
  };
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }
    handleWs(m);
  };
  const down = () => {
    try { ws.close(); } catch (_) {}
    if (state.ws === ws) state.ws = null;
    state.wsConnected = false;
    setConn();
    if (state.pingTimer) { clearInterval(state.pingTimer); state.pingTimer = null; }
    scheduleReconnect();
  };
  ws.onclose = down; ws.onerror = down;
}
function scheduleReconnect() {
  if (state.wsRetryTimer) return;
  const delay = Math.min(1000 * Math.pow(2, state.wsRetry || 0), 30000);
  state.wsRetry = Math.min((state.wsRetry || 0) + 1, 6);
  state.wsRetryTimer = setTimeout(() => { state.wsRetryTimer = null; connectWs(); }, delay);
}
function setConn() {
  const dot = $("#connDot"), label = $("#connLabel");
  if (!dot || !label) return;
  if (state.wsConnected) { dot.className = "dot on"; label.textContent = "Connected"; }
  else if ((state.wsRetry || 0) > 0) { dot.className = "dot retry"; label.textContent = "Reconnecting"; }
  else { dot.className = "dot"; label.textContent = "Connecting"; }
}
function handleWs(m) {
  const t = m.type, d = m.data || {};
  if (t === "status") {
    if (d.sid && d.sid !== getClientId()) {
      state.clientId = d.sid;
      try { localStorage.setItem("lazycomfy.clientId", d.sid); } catch (_) {}
    }
    return;
  }
  const job = state.currentJob;
  if (!job) return;
  if (t === "progress") {
    if (d.prompt_id && d.prompt_id !== job.prompt_id) return;
    if (typeof d.value === "number" && typeof d.max === "number" && d.max > 0) {
      setProgress(Math.round((d.value / d.max) * 100));
      setJobState("Sampling " + d.value + "/" + d.max);
    }
  } else if (t === "executing") {
    if (d.prompt_id && d.prompt_id !== job.prompt_id) return;
    if (d.node) setJobState("Node " + d.node + "…");
    else { pollHistory(); }
  } else if (t === "executed") {
    if (d.prompt_id && d.prompt_id !== job.prompt_id) return;
    pollHistory();
  } else if (t === "execution_success") {
    if (d.prompt_id && d.prompt_id !== job.prompt_id) return;
    pollHistory();
  } else if (t === "execution_error" || t === "execution_interrupted") {
    if (d.prompt_id && d.prompt_id !== job.prompt_id) return;
    state.currentJob = null;
    setRunning(false); setProgress(null);
    setJobState(t === "execution_interrupted" ? "Cancelled" : "Error");
    if (t === "execution_error") showErrToast("prompt", "Run failed", (d.exception_message || d.exception_type || "Execution error").slice(0, 500), []);
  }
}

/* ---- minimal custom-select enhancer (same classes as other pages) ---- */
(function(){
  const SELECTOR = "select:not([data-custom-skip])";
  const enhanced = new WeakMap();
  function syncOne(sel, wrap, valueSpan, optionsWrap) {
    const opt = sel.options[sel.selectedIndex];
    valueSpan.textContent = opt ? opt.textContent.trim() : "Select…";
    Array.from(optionsWrap.children).forEach((b, i) => {
      b.classList.toggle("active", i === sel.selectedIndex);
    });
  }
  function createCustomSelect(sel) {
    if (enhanced.has(sel) || sel.closest(".custom-select")) return;
    if (sel.multiple || sel.size > 1) return;
    sel.classList.add("custom-select-original");
    sel.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "custom-select";
    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "custom-select-trigger";
    const valueSpan = document.createElement("span");
    valueSpan.className = "custom-select-value";
    const arrow = document.createElement("span");
    arrow.className = "custom-select-arrow";
    arrow.innerHTML = '<svg width="12" height="7" viewBox="0 0 12 7" fill="none"><path d="M1 1.5l5 4 5-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    trigger.appendChild(valueSpan); trigger.appendChild(arrow);
    const dropdown = document.createElement("div");
    dropdown.className = "custom-select-dropdown";
    dropdown.hidden = true;
    const optionsWrap = document.createElement("div");
    optionsWrap.className = "custom-select-options";
    dropdown.appendChild(optionsWrap);
    const rebuild = () => {
      optionsWrap.innerHTML = "";
      Array.from(sel.options).forEach((opt) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "custom-select-option";
        b.textContent = opt.textContent.trim();
        b.addEventListener("click", () => {
          sel.value = opt.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          syncOne(sel, wrap, valueSpan, optionsWrap);
          dropdown.hidden = true; wrap.classList.remove("open");
        });
        optionsWrap.appendChild(b);
      });
      syncOne(sel, wrap, valueSpan, optionsWrap);
    };
    trigger.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const willOpen = dropdown.hidden;
      document.querySelectorAll(".custom-select.open").forEach(o => { o.classList.remove("open"); o.querySelector(".custom-select-dropdown").hidden = true; });
      if (willOpen) { wrap.classList.add("open"); dropdown.hidden = false; }
    });
    document.addEventListener("click", (e) => {
      if (!wrap.contains(e.target)) { wrap.classList.remove("open"); dropdown.hidden = true; }
    });
    sel.addEventListener("change", () => syncOne(sel, wrap, valueSpan, optionsWrap));
    sel.insertAdjacentElement("afterend", wrap);
    wrap.appendChild(trigger); wrap.appendChild(dropdown);
    enhanced.set(sel, { rebuild });
    rebuild();
  }

    document.querySelectorAll(SELECTOR).forEach(createCustomSelect);
    document.querySelectorAll("select[data-custom-original]").forEach(() => {});
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", window.refreshCustomSelects);
  else window.refreshCustomSelects();
  new MutationObserver(() => {
    if (window.__csT) clearTimeout(window.__csT);
    window.__csT = setTimeout(window.refreshCustomSelects, 30);
  }).observe(document.body, { childList: true, subtree: true });
})();

    const all = await coreGet("/lazycomfy/api/session/state");
    const saved = all && all.custom;
    if (saved && saved.source && saved.source.type === "user" && saved.source.path && !state.wf) {
      try {
        const wf = await loadUserFile(saved.source.path);
        await setWorkflow(wf, saved.name || saved.source.path.split("/").pop(), saved.source);
      } catch (_) {}
    }
  } catch (_) {}
  state.booted = true;
}
init();



</script>
</body>
